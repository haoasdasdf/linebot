version: "3"
services:
  api:
    restart: always
    build: .
    # depends_on:
    #   - redis
    expose:
      - "5000"
    volumes:
      - ./:/usr/src/app/api
    environment:
      - FLASK_APP=app.py
      - RUN=flask run --host=0.0.0.0 --port=5000
    env_file: .env.dev
    # command: /usr/local/bin/gunicorn app:app -w 2 -b :8000 --reload
    command: python app.py --env dev --redis local

  rworker:
    restart: always
    build: .
    volumes:
      - ./:/usr/src/app/api
    links:
      - redis:redis
    depends_on:
      - redis
    env_file: .env.dev
    command: python -u rq_worker.py --env dev --redis local


  nginx:
    restart: always
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    # volumes_from:
    #   - api
    links:
      - api:api

  redis:
    image: redis
