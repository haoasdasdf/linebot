version: "3"
services:
  api-dev:
    restart: always
    build: ./dev
    volumes: 
      - ./dev:/usr/src/app/api
    # depends_on:
    #   - redis
    expose:
      - "5000"
    env_file: ./dev/.env.dev
    environment:
      - FLASK_APP=app.py
      - RUN=flask run --host=0.0.0.0 --port=5000
      - RQ_REDIS_URL=redis://redis
    # command: /usr/local/bin/gunicorn app:app -w 2 -b :8000 --reload
    command: python app.py --env dev --redis local

  rworker-dev:
    restart: always
    build: ./dev
    volumes: 
      - ./dev:/usr/src/app/api
    links:
      - redis:redis
    depends_on:
      - redis
    environment: 
      - RQ_REDIS_URL=redis://redis
    env_file: ./dev/.env.dev
    command: python -u rq_worker.py --env dev --redis local

  api-prod:
    restart: always
    build: ./prod
    volumes: 
      - ./prod:/usr/src/app/api
    # depends_on:
    #   - redis
    expose:
      - "5000"
    env_file: ./prod/.env.prod
    environment:
      - FLASK_APP=app.py
      - RUN=flask run --host=0.0.0.0 --port=5000
      - RQ_REDIS_URL=redis://redis
    # command: /usr/local/bin/gunicorn app:app -w 2 -b :8000 --reload
    command: python app.py --env prod --redis local

  rworker-prod:
    restart: always
    build: ./prod
    volumes: 
      - ./prod:/usr/src/app/api
    links:
      - redis:redis
    depends_on:
      - redis
    environment: 
      - RQ_REDIS_URL=redis://redis
    env_file: ./prod/.env.prod
    command: python -u rq_worker.py --env prod --redis local

  nginx:
    restart: always
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d

    links:
      - api-dev:api-dev
      - api-prod:api-prod

  redis:
    image: redis
