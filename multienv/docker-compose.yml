version: "3"
services:
  api-dev:
    restart: always
    build: ./dev
    # depends_on:
    #   - redis
    expose:
      - "5000"
    env_file: ./dev/.env.dev
    environment:
      - FLASK_APP=app.py
      - RUN='flask run --host=0.0.0.0 --port=5000'
    # command: /usr/local/bin/gunicorn app:app -w 2 -b :8000 --reload
    command: python app.py dev

  rworker-dev:
    restart: always
    build: ./dev
    # depends_on:
    #   - redis
    env_file: ./dev/.env.dev
    command: python -u rq_worker.py dev

  api-prod:
    restart: always
    build: ./prod
    # depends_on:
    #   - redis
    expose:
      - "5000"
    env_file: ./prod/.env.prod
    environment:
      - FLASK_APP=app.py
      - RUN='flask run --host=0.0.0.0 --port=5000'
    # command: /usr/local/bin/gunicorn app:app -w 2 -b :8000 --reload
    command: python app.py prod

  rworker-prod:
    restart: always
    build: ./prod
    # depends_on:
    #   - redis
    env_file: ./prod/.env.prod
    command: python -u rq_worker.py prod

  nginx:
    restart: always
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    # volumes_from:
    #   - api
    links:
      - api-dev:api-dev
      - api-prod:api-prod

  # redis:
  #   image: redis
